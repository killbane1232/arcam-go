services:
  arcam:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      ARCAM_API_TOKEN: ${ARCAM_API_TOKEN:?Set ARCAM_API_TOKEN in .env before starting Docker}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - arcam-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  arcam-data:
